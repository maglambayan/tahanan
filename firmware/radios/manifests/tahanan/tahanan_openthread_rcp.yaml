# Tahanan Hub U20: OpenThread RCP firmware (Spinel over UART), for Thread and Matter over Thread.
# Format: NabuCasa/silabs-firmware-builder manifest, derived from manifests/nabucasa/yellow/yellow_openthread_rcp.yaml
# as of 2026-11. Differences from Yellow: device, UART pins, no activity LED, no MGM210 clock workaround.
# Status: NOT built and NOT flashed. See ../../README.md.
name: Tahanan OpenThread RCP
device: MGM240PA32VNA
base_project: src/openthread_rcp
filename: "{manifest_name}_{ot_rcp_version.split('/')[-1]}_gsdk_{sdk_version}"
sdk: "simplicity_sdk:2026.6.1"
toolchain: "14.2.1.20241119"

gbl:
  fw_type: openthread_rcp
  ot_rcp_version: dynamic
  baudrate: 460800

sdk_patches:
  - disable_gp_rx_filter.patch
  - uart_tx_drop_on_timeout.patch
  - uart_tx_bounded_wait_usart.patch

sdk_extension:
  - id: watchdog
    version: 1.0.0
    vendor: nabucasa

add_components:
- id: iostream_usart
  instance: [vcom]
- id: watchdog
  vendor: nabucasa
  package: watchdog

c_defines:
  OPENTHREAD_CONFIG_NCP_TX_BUFFER_SIZE:
    type: c_flag
    value: 4096  # Default is 2048

  SL_IOSTREAM_USART_VCOM_PERIPHERAL: USART0
  SL_IOSTREAM_USART_VCOM_PERIPHERAL_NO: 0
  SL_IOSTREAM_USART_VCOM_BAUDRATE: 460800
  SL_IOSTREAM_USART_VCOM_FLOW_CONTROL_TYPE: usartHwFlowControlCtsAndRts

  # Schematic nets: PC00 TH_M2H_TXD, PC01 TH_H2M_TXD, PC02 TH_M2H_RTS, PC03 TH_H2M_RTS
  SL_IOSTREAM_USART_VCOM_TX_PORT: SL_GPIO_PORT_C
  SL_IOSTREAM_USART_VCOM_TX_PIN:  0
  SL_IOSTREAM_USART_VCOM_RX_PORT: SL_GPIO_PORT_C
  SL_IOSTREAM_USART_VCOM_RX_PIN:  1
  SL_IOSTREAM_USART_VCOM_RTS_PORT: SL_GPIO_PORT_C
  SL_IOSTREAM_USART_VCOM_RTS_PIN:  2
  SL_IOSTREAM_USART_VCOM_CTS_PORT: SL_GPIO_PORT_C
  SL_IOSTREAM_USART_VCOM_CTS_PIN:  3
