# Pin record for the Tahanan thread radio. Merge into a silabs-firmware-builder manifest for an MGM240P target.
device: MGM240PA32VNA3
name: tahanan_openthread_rcp
uart:
  baudrate: 460800
  flow_control: rtscts
  tx: PC00
  rx: PC01
  rts: PC02
  cts: PC03
bootloader:
  button: PB00
  button_active: low
swd:
  swclk: PA01
  swdio: PA02
rf:
  antenna: built-in
  max_tx_power_dbm: 10
