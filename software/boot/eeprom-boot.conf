# Tahanan Hub: CM5 bootloader (EEPROM) configuration. Apply with rpi-eeprom-config or usbboot (see docs/recovery-and-update.md).
[all]
BOOT_UART=0
# Read right to left: NVMe (6) first, then USB mass storage (4), then restart (f).
BOOT_ORDER=0xf46
# The carrier does not use the CM5 CC pins. Power comes from U5 (4 A), so tell the firmware the supply is good for 5 A
# and that USB ports need no current limiting on its side (TPS2561 limits each port to about 1.2 A).
PSU_MAX_CURRENT=5000
# M.2 socket is wired directly, there is no HAT+ EEPROM to announce it.
PCIE_PROBE=1
POWER_OFF_ON_HALT=0
WAKE_ON_GPIO=1
NET_INSTALL_ENABLED=0
